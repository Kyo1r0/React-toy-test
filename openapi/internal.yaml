openapi: 3.1.0

info:
  title: FizzBuzz Study - Internal API
  version: 1.0.0
  description: |
    FizzBuzz サーバーの内部 API。API サーバーからのみ呼ばれる。
    ブラウザには公開しない。

    ## 責務
    計算だけ。DB も設定も知らない。
    「この範囲を、このルールで変換して返す」以上のことはしない。

    ## 意図的に持っていないもの
    - 数字の永続化。それは API サーバーの仕事。
    - 「負の数をどう解釈するか」の判断。API サーバーが解決済みの
      start/end を渡してくるので、こちらは言われた範囲を素直に回すだけ。
    - ページングの概念。API サーバーが必要な範囲だけを切って投げてくる。

    ## ルールを引数にしている理由
    3=Fizz / 5=Buzz を実装に埋め込まず rules で受け取ることで、
    後から「7 の倍数で Bazz」を足したくなってもこのサーバーは無変更で済む。

servers:
  - url: http://localhost:3002
    description: ローカル開発

security:
  - internalToken: []

tags:
  - name: fizzbuzz
  - name: ops

paths:
  /internal/fizzbuzz:
    post:
      tags: [fizzbuzz]
      summary: 指定範囲を FizzBuzz 変換する
      description: |
        副作用はないが、rules を含む構造をボディで渡す必要があるため POST。
        （GET のクエリ文字列に押し込むより素直なので、冪等性より表現を優先している）

        start > end の場合は 400。降順の生成はサポートしない。
        範囲の広さ (end - start + 1) には上限があり、超えると 400。
      operationId: generateFizzBuzz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FizzBuzzRequest"
            examples:
              basic:
                summary: 1〜15
                value:
                  start: 1
                  end: 15
                  rules:
                    - { divisor: 3, word: Fizz }
                    - { divisor: 5, word: Buzz }
              paged:
                summary: 2 ページ目だけ欲しいとき（API サーバーが範囲を切って投げる）
                value:
                  start: 101
                  end: 200
                  rules:
                    - { divisor: 3, word: Fizz }
                    - { divisor: 5, word: Buzz }
              negative:
                summary: 負の範囲。API サーバー側で解決済みの start/end が来る
                value:
                  start: -15
                  end: -1
                  rules:
                    - { divisor: 3, word: Fizz }
                    - { divisor: 5, word: Buzz }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FizzBuzzResponse"
              examples:
                basic:
                  value:
                    start: 1
                    end: 15
                    items:
                      - "1"
                      - "2"
                      - Fizz
                      - "4"
                      - Buzz
                      - Fizz
                      - "7"
                      - "8"
                      - Fizz
                      - Buzz
                      - "11"
                      - Fizz
                      - "13"
                      - "14"
                      - FizzBuzz
        "400":
          description: |
            リクエストが不正。
            - start > end
            - 範囲が広すぎる (RANGE_TOO_LARGE)
            - divisor が 0 以下
            - rules が空
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                reversed:
                  value:
                    error:
                      code: INVALID_RANGE
                      message: start は end 以下である必要があります
                      details:
                        start: 10
                        end: 1
                tooLarge:
                  value:
                    error:
                      code: RANGE_TOO_LARGE
                      message: 一度に生成できるのは 10000 件までです
                      details:
                        limit: 10000
                        requested: 50000
                badDivisor:
                  value:
                    error:
                      code: INVALID_RULE
                      message: divisor は 1 以上の整数で指定してください
                      details:
                        index: 0
                        divisor: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/health:
    get:
      tags: [ops]
      summary: 死活確認
      description: |
        認証不要。API サーバーの起動時ログや、502 が出たときの切り分けに使う。
      operationId: health
      security: []
      responses:
        "200":
          description: 生きている
          content:
            application/json:
              schema:
                type: object
                required: [status, uptimeSec]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  uptimeSec:
                    type: number
                additionalProperties: false
              example:
                status: ok
                uptimeSec: 42.7

components:
  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: |
        API サーバーと共有する固定トークン (env: FIZZBUZZ_TOKEN)。
        勉強用なので固定文字列で十分。外部公開する場合は当然これでは足りない。

  schemas:
    Rule:
      type: object
      required: [divisor, word]
      properties:
        divisor:
          type: integer
          minimum: 1
          description: この数で割り切れたら word を出す
          example: 3
        word:
          type: string
          minLength: 1
          maxLength: 32
          example: Fizz
      additionalProperties: false

    FizzBuzzRequest:
      type: object
      required: [start, end, rules]
      properties:
        start:
          type: integer
          description: 開始値（含む）。負でもよい。
          example: 1
        end:
          type: integer
          description: 終了値（含む）。start 以上であること。
          example: 15
        rules:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            適用順に並べる。複数該当したら word を配列順に連結する
            （3 と 5 の両方に該当 -> "FizzBuzz"）。
            どれにも該当しなければ数値を文字列化して返す。
            判定は割り切れるかどうかのみ。負の数でも -15 % 3 === 0 なので Fizz になる。
          items:
            $ref: "#/components/schemas/Rule"
      additionalProperties: false

    FizzBuzzResponse:
      type: object
      required: [start, end, items]
      properties:
        start:
          type: integer
          description: エコーバック。API サーバー側の突き合わせ用。
        end:
          type: integer
        items:
          type: array
          description: |
            start から end まで昇順の変換結果。
            要素数は必ず end - start + 1 になる。
            n を返さず文字列だけにしているのは、順序で対応が取れるため。
            公開 API 側で n を付け直す。
          items:
            type: string
      additionalProperties: false

    ErrorResponse:
      type: object
      required: [error]
      description: 公開 API と同じ形にしておくと、変換コードが薄くて済む。
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - INVALID_RANGE
                - RANGE_TOO_LARGE
                - INVALID_RULE
                - UNAUTHORIZED
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          additionalProperties: false
      additionalProperties: false

  responses:
    Unauthorized:
      description: トークンが無い / 一致しない (401)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHORIZED
              message: 認証に失敗しました

    InternalError:
      description: サーバー内部エラー (500)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: 予期しないエラーが発生しました
