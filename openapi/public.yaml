openapi: 3.1.0

info:
  title: FizzBuzz Study - Public API
  version: 1.0.0
  description: |
    React (SPA) から呼ばれる公開 API。

    ## 責務
    - 数字の永続化と、現在の設定にもとづく保存時バリデーション
    - 受け付ける整数の設定 (settings) の管理
    - FizzBuzz サーバーへの委譲（クライアントは FizzBuzz サーバーを直接叩かない）

    ## 設計上の決めごと
    - settings はシングルトン (1 レコード固定)。PATCH は用意せず PUT で全項目送る。
    - バリデーションは「保存時のみ」。設定を後から狭めても保存済みの数字は消えないし、
      実行もできる。ただし GET のレスポンスに現在の設定から見た `valid` を含めるので、
      クライアント側で警告表示ができる。
    - FizzBuzz の対象範囲:
        value >=  1 -> 1 .. value
        value <= -1 -> value .. -1
        value ==  0 -> 空
    - FizzBuzz のルール (3=Fizz, 5=Buzz) は API サーバーが固定値として保持する。
      設定画面の対象は「受け付ける整数」だけなので、公開 API には現れない。

servers:
  - url: http://localhost:3001/api/v1
    description: ローカル開発

tags:
  - name: settings
    description: 受け付ける整数の設定（画面3）
  - name: numbers
    description: 数字の保存と一覧（画面1）
  - name: fizzbuzz
    description: FizzBuzz の実行（画面2）

paths:
  /settings:
    get:
      tags: [settings]
      summary: 現在の設定を取得
      description: |
        画面1（入力フォームの制限表示・クライアント側の事前検証）と
        画面3（設定フォームの初期値）の両方から呼ばれる。
      operationId: getSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [settings]
      summary: 設定を更新
      description: |
        全項目を送る。部分更新は不可。

        サーバー側の環境変数 `SETTINGS_HARD_MAX` によるハードリミットがあり、
        それを超える max を送ると 422 (SETTINGS_LIMIT_EXCEEDED) になる。
        設定画面から max に 10 億を入れて FizzBuzz サーバーを落とせないようにするため。
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
            examples:
              default:
                summary: 1〜1000 の正の整数のみ受け付ける
                value:
                  min: 1
                  max: 1000
                  allowNegative: false
                  multipleOf: null
              negative:
                summary: 負の数も許可
                value:
                  min: -100
                  max: 100
                  allowNegative: true
                  multipleOf: null
      responses:
        "200":
          description: 更新後の設定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "422":
          description: |
            設定値そのものが不正。
            - min > max
            - max がハードリミット超過 (SETTINGS_LIMIT_EXCEEDED)
            - allowNegative: false なのに min < 0
            - multipleOf <= 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                hardMax:
                  value:
                    error:
                      code: SETTINGS_LIMIT_EXCEEDED
                      message: max は 100000 以下で指定してください
                      details:
                        hardMax: 100000
                        requested: 1000000000
                minMax:
                  value:
                    error:
                      code: INVALID_SETTINGS
                      message: min は max 以下である必要があります
                      details:
                        min: 500
                        max: 100
        "500":
          $ref: "#/components/responses/InternalError"

  /numbers:
    get:
      tags: [numbers]
      summary: 保存済みの数字を一覧
      description: 新しい順。各要素には現在の設定から見た `valid` が付く。
      operationId: listNumbers
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/NumberRecord"
                  page:
                    $ref: "#/components/schemas/PageInfo"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [numbers]
      summary: 数字を保存
      description: |
        現在の設定に照らして検証する。範囲外なら 422 で、
        details に現在の設定を返すのでクライアントはそのまま表示できる。
      operationId: createNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: integer
                  description: 保存する整数
              additionalProperties: false
            examples:
              ok:
                value:
                  value: 15
      responses:
        "201":
          description: 作成された
          headers:
            Location:
              description: 作成されたリソースの URI
              schema:
                type: string
              example: /api/v1/numbers/12
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberRecord"
        "400":
          description: |
            型が違う / 整数でない / value がない。
            JSON として壊れている場合もここ。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notInteger:
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: value は整数で指定してください
                      details:
                        field: value
                        received: "3.5"
        "422":
          description: 形式は正しいが、現在の設定では受け付けられない値
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                outOfRange:
                  value:
                    error:
                      code: VALUE_OUT_OF_RANGE
                      message: 値は 1〜1000 の範囲で指定してください
                      details:
                        min: 1
                        max: 1000
                        received: 5000
                negative:
                  value:
                    error:
                      code: NEGATIVE_NOT_ALLOWED
                      message: 負の数は現在の設定では受け付けられません
                      details:
                        received: -5
                multiple:
                  value:
                    error:
                      code: NOT_MULTIPLE_OF
                      message: 3 の倍数を指定してください
                      details:
                        multipleOf: 3
                        received: 10
        "500":
          $ref: "#/components/responses/InternalError"

  /numbers/{id}:
    parameters:
      - $ref: "#/components/parameters/NumberId"

    get:
      tags: [numbers]
      summary: 数字を 1 件取得
      operationId: getNumber
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberRecord"
        "404":
          $ref: "#/components/responses/NumberNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [numbers]
      summary: 数字を削除
      operationId: deleteNumber
      responses:
        "204":
          description: 削除した（ボディなし）
        "404":
          $ref: "#/components/responses/NumberNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /numbers/{id}/fizzbuzz:
    parameters:
      - $ref: "#/components/parameters/NumberId"

    get:
      tags: [fizzbuzz]
      summary: 保存済みの数字まで FizzBuzz を実行
      description: |
        副作用がなく、何度呼んでも同じ結果が返るので GET。

        API サーバーは page/perPage から実際の start/end を計算し、
        必要な範囲だけを内部 API (POST /internal/fizzbuzz) に投げる。
        max を大きくしても全件をメモリに載せないための構造。

        上流が落ちている場合は 502、時間内に返らない場合は 504。
        どちらもここで初めて現れるエラーで、クライアントは「再試行」を出せばよい。
      operationId: runFizzBuzz
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FizzBuzzResult"
              examples:
                fifteen:
                  summary: value=15 の 1 ページ目
                  value:
                    numberId: 12
                    value: 15
                    range:
                      start: 1
                      end: 15
                    items:
                      - { n: 1, text: "1" }
                      - { n: 2, text: "2" }
                      - { n: 3, text: "Fizz" }
                      - { n: 4, text: "4" }
                      - { n: 5, text: "Buzz" }
                      - { n: 15, text: "FizzBuzz" }
                    page:
                      page: 1
                      perPage: 100
                      total: 15
                      hasNext: false
                zero:
                  summary: value=0 は空
                  value:
                    numberId: 20
                    value: 0
                    range: null
                    items: []
                    page:
                      page: 1
                      perPage: 100
                      total: 0
                      hasNext: false
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NumberNotFound"
        "502":
          description: FizzBuzz サーバーがエラーを返した / 到達できない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                upstream:
                  value:
                    error:
                      code: UPSTREAM_ERROR
                      message: FizzBuzz サーバーとの通信に失敗しました
                      details:
                        upstreamStatus: 500
        "504":
          description: FizzBuzz サーバーがタイムアウトした
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                timeout:
                  value:
                    error:
                      code: UPSTREAM_TIMEOUT
                      message: FizzBuzz サーバーの応答がありませんでした
                      details:
                        timeoutMs: 3000
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    NumberId:
      name: id
      in: path
      required: true
      description: 保存済みの数字の ID
      schema:
        type: integer
        minimum: 1
      example: 12

    Page:
      name: page
      in: query
      required: false
      description: 1 始まり
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPage:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

  schemas:
    Settings:
      type: object
      required: [min, max, allowNegative, multipleOf, updatedAt]
      properties:
        min:
          type: integer
          description: 受け付ける下限（この値を含む）
          example: 1
        max:
          type: integer
          description: 受け付ける上限（この値を含む）
          example: 1000
        allowNegative:
          type: boolean
          description: |
            false のとき、min が負でも 0 未満の値は拒否する。
            min/max とは独立したガードとして働く。
          example: false
        multipleOf:
          type: [integer, "null"]
          minimum: 1
          description: 指定するとその倍数のみ受け付ける。null なら制限なし。
          example: null
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    SettingsInput:
      type: object
      required: [min, max, allowNegative, multipleOf]
      description: PUT /settings のボディ。updatedAt はサーバーが振る。
      properties:
        min:
          type: integer
        max:
          type: integer
        allowNegative:
          type: boolean
        multipleOf:
          type: [integer, "null"]
          minimum: 1
      additionalProperties: false

    NumberRecord:
      type: object
      required: [id, value, valid, createdAt]
      properties:
        id:
          type: integer
          example: 12
        value:
          type: integer
          example: 15
        valid:
          type: boolean
          description: |
            現在の設定に照らして、いま保存しようとしたら通るかどうか。
            保存後に設定を狭めると false になりうる。表示用であって、
            false でも FizzBuzz の実行は拒否されない。
          example: true
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    FizzBuzzItem:
      type: object
      required: [n, text]
      properties:
        n:
          type: integer
          description: 対象の整数
          example: 15
        text:
          type: string
          description: 変換後の文字列。該当なしなら n を文字列化したもの。
          example: FizzBuzz
      additionalProperties: false

    FizzBuzzResult:
      type: object
      required: [numberId, value, range, items, page]
      properties:
        numberId:
          type: integer
        value:
          type: integer
          description: 保存されている元の数字
        range:
          description: 実際に計算した範囲全体（このページの範囲ではない）。value=0 のとき null。
          oneOf:
            - type: "null"
            - type: object
              required: [start, end]
              properties:
                start:
                  type: integer
                end:
                  type: integer
              additionalProperties: false
        items:
          type: array
          items:
            $ref: "#/components/schemas/FizzBuzzItem"
        page:
          $ref: "#/components/schemas/PageInfo"
      additionalProperties: false

    PageInfo:
      type: object
      required: [page, perPage, total, hasNext]
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
          description: 全件数
        hasNext:
          type: boolean
      additionalProperties: false

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: 人間向け。クライアントはこれを分岐に使わない。
            details:
              type: object
              description: |
                code ごとに形が違う任意のオブジェクト。
                クライアントは code で分岐してから details を読む。
              additionalProperties: true
          additionalProperties: false
      additionalProperties: false

    ErrorCode:
      type: string
      description: |
        機械可読なエラー識別子。クライアントはこれで分岐する。
        message は変わりうるので分岐に使わない。
      enum:
        - INVALID_REQUEST
        - VALUE_OUT_OF_RANGE
        - NEGATIVE_NOT_ALLOWED
        - NOT_MULTIPLE_OF
        - INVALID_SETTINGS
        - SETTINGS_LIMIT_EXCEEDED
        - NUMBER_NOT_FOUND
        - UPSTREAM_ERROR
        - UPSTREAM_TIMEOUT
        - INTERNAL_ERROR

  responses:
    InvalidRequest:
      description: リクエストの形式が不正 (400)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVALID_REQUEST
              message: perPage は 1〜500 の整数で指定してください
              details:
                field: perPage
                received: "0"

    NumberNotFound:
      description: 指定された ID の数字が存在しない (404)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NUMBER_NOT_FOUND
              message: 指定された数字は見つかりませんでした
              details:
                id: 999

    InternalError:
      description: サーバー内部エラー (500)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: 予期しないエラーが発生しました
